name: CI

on:
  pull_request:
    branches: [main]
    # `edited` is what makes the title check re-run after a bad title is fixed.
    # Without it a corrected title stays red until someone pushes a commit.
    types: [opened, edited, reopened, synchronize]
  # main itself, after a squash merge. Two pull requests that were each green
  # against an older main can still land a red main between them, and nothing
  # else runs there — Vercel deploys production from this branch.
  push:
    branches: [main]

# npm ci runs lifecycle scripts from the pull request's own lockfile. Same-repo
# pull requests would otherwise get the repository's default token scopes.
permissions:
  contents: read

# A new push to a pull request supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request title is what a squash merge writes onto main — the branch's
  # own commit messages are squashed away — so the title is the thing worth
  # gating. specs/tech-stack.md § Branching & pull request workflow is the rule
  # this enforces; the grammar below is Conventional Commits 1.0.0.
  commit-convention:
    name: Commit convention
    # `push` events carry no pull request, so there is no title to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        # Through the environment, never interpolated into the script: a title
        # is attacker-controlled text and `${{ }}` inside `run` is executed.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'

          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .+$"; then
            echo "::error::Title must be '<type>(<scope>): <subject>'. Types: $types"
            echo "Got: $TITLE"
            exit 1
          fi

          subject=${TITLE#*: }

          if printf '%s' "$subject" | grep -Eq '^[A-Z]'; then
            echo "::error::Subject must be lower case. Got: $subject"
            exit 1
          fi

          if printf '%s' "$subject" | grep -q '\.$'; then
            echo "::error::Subject must not end with a period. Got: $subject"
            exit 1
          fi

          if [ "${#subject}" -gt 72 ]; then
            echo "::error::Subject must be 72 characters or fewer, got ${#subject}."
            exit 1
          fi

          echo "Title is a valid Conventional Commit: $TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  # Proves specs/roadmap.md Phase 2's Done when line — "migrations run clean
  # against Neon from a fresh database and seed data loads" — on every pull
  # request rather than once by hand, and gives Phase 7's E2E runs the
  # throwaway-database harness they will need.
  #
  # Every run gets its own Neon branch, so concurrent pull requests never
  # collide, and the branch is deleted whatever happens to the run.
  database:
    name: Database
    runs-on: ubuntu-latest
    env:
      NEON_API: https://console.neon.tech/api/v2
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Before the branch exists, so a broken install does not leave one
      # running while npm resolves the tree.
      - run: npm ci

      - name: Create a Neon branch for this run
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            --request POST "$NEON_API/projects/$NEON_PROJECT_ID/branches" \
            --header "Authorization: Bearer $NEON_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input \
              --arg name "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              '{branch: {name: $name}, endpoints: [{type: "read_write"}]}')")

          # Recorded before anything else can fail, so the teardown step below
          # always has an id to delete.
          branch_id=$(printf '%s' "$response" | jq --raw-output '.branch.id')
          echo "branch_id=$branch_id" >> "$GITHUB_OUTPUT"

          uri=$(printf '%s' "$response" \
            | jq --raw-output '.connection_uris[0].connection_uri')

          # The URI carries the role password. Masked before it can reach a log.
          echo "::add-mask::$uri"

          # A fresh branch has no pooler of its own to worry about, so the same
          # URI serves both: prisma.config.ts reads the unpooled one to migrate,
          # and the seed reads DATABASE_URL.
          echo "DATABASE_URL=$uri" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=$uri" >> "$GITHUB_ENV"

      - name: Apply migrations to the empty branch
        run: npx prisma migrate deploy

      - name: Load the seed data
        run: npm run seed | tee first-run.txt

      - name: Seed again and require identical rows
        run: |
          set -euo pipefail

          npm run seed | tee second-run.txt

          # The seed reports a count per model. Identical counts across two
          # runs is what makes it safe to re-run against a shared database.
          counts() { grep -E '^(producers|sequestration sites) ' "$1"; }

          if ! diff <(counts first-run.txt) <(counts second-run.txt); then
            echo "::error::Seeding twice changed the row counts — it is not idempotent."
            exit 1
          fi

          counts second-run.txt

      # always(), because a failed, cancelled, or killed run must not leak a
      # branch. The id guard covers the case where creation itself failed.
      - name: Delete the Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # Through the environment rather than interpolated into the script,
          # like the pull request title above.
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --request DELETE \
            "$NEON_API/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            --header "Authorization: Bearer $NEON_API_KEY" > /dev/null

          echo "Deleted Neon branch $BRANCH_ID"
