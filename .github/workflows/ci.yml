name: CI

on:
  pull_request:
    branches: [main]
    # `edited` is what makes the title check re-run after a bad title is fixed.
    # Without it a corrected title stays red until someone pushes a commit.
    types: [opened, edited, reopened, synchronize]
  # main itself, after a squash merge. Two pull requests that were each green
  # against an older main can still land a red main between them, and nothing
  # else runs there — Vercel deploys production from this branch.
  push:
    branches: [main]

# npm ci runs lifecycle scripts from the pull request's own lockfile. Same-repo
# pull requests would otherwise get the repository's default token scopes.
permissions:
  contents: read

# A new push to a pull request supersedes the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pull request title is what a squash merge writes onto main — the branch's
  # own commit messages are squashed away — so the title is the thing worth
  # gating. specs/tech-stack.md § Branching & pull request workflow is the rule
  # this enforces; the grammar below is Conventional Commits 1.0.0.
  commit-convention:
    name: Commit convention
    # `push` events carry no pull request, so there is no title to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        # Through the environment, never interpolated into the script: a title
        # is attacker-controlled text and `${{ }}` inside `run` is executed.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'

          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9-]+\))?!?: .+$"; then
            echo "::error::Title must be '<type>(<scope>): <subject>'. Types: $types"
            echo "Got: $TITLE"
            exit 1
          fi

          subject=${TITLE#*: }

          if printf '%s' "$subject" | grep -Eq '^[A-Z]'; then
            echo "::error::Subject must be lower case. Got: $subject"
            exit 1
          fi

          if printf '%s' "$subject" | grep -q '\.$'; then
            echo "::error::Subject must not end with a period. Got: $subject"
            exit 1
          fi

          if [ "${#subject}" -gt 72 ]; then
            echo "::error::Subject must be 72 characters or fewer, got ${#subject}."
            exit 1
          fi

          echo "Title is a valid Conventional Commit: $TITLE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # ESLint checks no formatting: eslint-config-prettier switches off every
      # rule Prettier owns, so without this nothing does, and `npm run format`
      # later lands a diff over files nobody touched.
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  # Proves specs/roadmap.md Phase 2's Done when line — "migrations run clean
  # against Neon from a fresh database and seed data loads" — on every pull
  # request rather than once by hand, and gives Phase 7's E2E runs the
  # throwaway-database harness it will need.
  #
  # It proves one half of that line, not both. This job applies the checked-in
  # migration to a genuinely empty database and proves the seed is idempotent,
  # deterministically and on every pull request. It runs stock Postgres, not
  # Neon's build.
  #
  # Nothing proves the Neon half. An earlier version of this comment said the
  # Vercel preview did, on the reasoning that branch-per-preview hands each
  # pull request an empty Neon branch for vercel-build to migrate. The build
  # log disproved it: previews report "No pending migrations to apply", because
  # Neon's preview branches are copy-on-write clones that arrive already
  # carrying the parent's schema and rows. The preview proves the app builds
  # and runs against Neon and nothing more. See the spec's plan.md § Decisions,
  # which states the gap plainly, and validation.md § Open questions, which
  # carries the migrate-diff check as the cheapest substitute.
  database:
    name: Database
    runs-on: ubuntu-latest

    # Empty at the start of every run, which is the property being tested.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedstock
        ports:
          - 5432:5432
        # The job must not start querying before Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both, because prisma.config.ts migrates over the unpooled URL while the
      # seed connects over DATABASE_URL. There is no pooler here, so they are
      # the same string.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feedstock
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/feedstock

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # From empty. A migration that cannot apply to a fresh database is
      # exactly what should stop a merge.
      - name: Apply migrations to the empty database
        run: npx prisma migrate deploy

      # pipefail by hand: GitHub's default shell is `bash -e`, so without it
      # tee's success would mask a failing seed and this step would go green.
      - name: Load the seed data
        run: |
          set -o pipefail
          npm run seed | tee first-run.txt

      - name: Seed again and require identical rows
        run: |
          set -euo pipefail

          npm run seed | tee second-run.txt

          # The seed reports a count per model. Identical counts across two
          # runs is what makes it safe to re-run against a shared database.
          counts() { grep -E '^(producers|sequestration sites) ' "$1"; }

          if ! diff <(counts first-run.txt) <(counts second-run.txt); then
            echo "::error::Seeding twice changed the row counts — it is not idempotent."
            exit 1
          fi

          counts second-run.txt

      # specs/mission.md § Constraints makes movement history immutable, and a
      # movement rewritten while the trigger was missing leaves no trace of
      # having been. src/test/prisma-migration.test.ts asserts the SQL is still
      # checked in; only a real database can say whether it fires.
      #
      # The seed deliberately creates no movements — they are records of things
      # that physically happened — so this inserts its own against a seeded
      # producer. The container is thrown away with the job.
      - name: Require the append-only trigger to refuse a rewrite
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          psql() { command psql -h localhost -U postgres -d feedstock -v ON_ERROR_STOP=1 "$@"; }

          psql -c "
            INSERT INTO movements (id, direction, weight_kg, producer_id, recorded_at)
            SELECT 'ci_append_only_probe', 'INBOUND'::\"Direction\", 1250.500, id, now()
            FROM producers ORDER BY name LIMIT 1;
          "

          for statement in \
            "UPDATE movements SET weight_kg = 1 WHERE id = 'ci_append_only_probe'" \
            "DELETE FROM movements WHERE id = 'ci_append_only_probe'"
          do
            # The trigger raises, so a zero exit here is the failure.
            if psql -c "$statement" 2>/dev/null; then
              echo "::error::\"$statement\" succeeded. Movements are not append-only."
              exit 1
            fi

            echo "refused as it should be: $statement"
          done

          # And the row is still exactly as written.
          psql -tAc "
            SELECT weight_kg FROM movements WHERE id = 'ci_append_only_probe';
          " | grep -qx '1250.500' || {
            echo "::error::The probe row did not survive intact."
            exit 1
          }

  # specs/roadmap.md Phase 7. The full Playwright suite, both projects, against
  # a database that is empty at the start of every run.
  #
  # Its own service rather than an extension of the Database job: one red check
  # then means one thing, and branch protection gets a distinct E2E gate.
  # specs/2026-08-18-end-to-end-coverage/plan.md § Decisions.
  #
  # The migration, the seed and the sign-in are not steps here. They live in
  # e2e/global-setup.ts, so the local run and this one take one path and cannot
  # drift. This job supplies the container, the browser and the secrets.
  e2e:
    name: E2E
    runs-on: ubuntu-latest

    # Empty at the start of every run, which is what lets each spec name rows
    # without colliding with the last run's.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both, for the reason the Database job gives: prisma.config.ts migrates
      # over the unpooled URL while the seed and the app connect over
      # DATABASE_URL. There is no pooler here, so they are the same string.
      # Omitting the unpooled one does not fail — it migrates whatever
      # .env.local names, which is why e2e/global-setup.ts refuses a Neon host.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/feedstock
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/feedstock

      # The Clerk development instance. clerkSetup refuses a production secret
      # key outright, so this cannot be pointed at production by accident.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}

      # Read at build time. Without it redirectToSignIn in src/proxy.ts sends
      # the browser to Clerk's hosted page rather than this app's /sign-in, and
      # auth.spec.ts lands on a host it does not expect.
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Chromium alone. Both projects are Chromium, so the other engines would
      # cost a download a run for browsers nothing drives.
      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm run test:e2e

      # not cancelled() rather than failure(): a timed-out run is the one where
      # the report is hardest to do without.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
